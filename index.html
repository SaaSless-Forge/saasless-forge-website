<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SaaSless Forge - Custom software, forged for you. No templates. No bloat. Just software that fits." />
    <title>SaaSless Forge | Custom Software Studio</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://saasless-forge-app-manager.onrender.com/forge-analytics.js" data-endpoint="https://saasless-forge-app-manager.onrender.com/api/analytics/v1" data-key="fa_c34ba515716e1472e2b5f7d5ce38fd4f26e131ef2c174d21" defer></script>
  </head>
  <body>
    <!-- Hidden forms for Netlify form detection (React renders the real ones) -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>
    </form>
    <form name="sprint-signup" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <textarea name="project"></textarea>
      <input type="text" name="utm_source" />
      <input type="text" name="utm_medium" />
      <input type="text" name="utm_campaign" />
      <input type="text" name="utm_content" />
      <input type="text" name="utm_term" />
      <input type="text" name="fbclid" />
      <input type="text" name="gclid" />
      <input type="text" name="referrer" />
      <input type="text" name="landing_page" />
    </form>
    <form name="sprint-intake" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="mobile" />
      <input type="text" name="business" />
      <input type="url" name="website" />
      <input type="text" name="role" />
      <input type="text" name="role_other" />
      <textarea name="problem"></textarea>
      <input type="checkbox" name="cost_hours" />
      <input type="checkbox" name="cost_saas" />
      <input type="checkbox" name="cost_revenue" />
      <input type="checkbox" name="cost_team" />
      <input type="checkbox" name="cost_cx" />
      <input type="text" name="cost_other" />
      <textarea name="alternative"></textarea>
      <textarea name="deadline"></textarea>
      <textarea name="records"></textarea>
      <input type="text" name="users" />
      <input type="text" name="users_other" />
      <input type="text" name="screens" />
      <input type="checkbox" name="needs_uploads" />
      <input type="checkbox" name="needs_csv" />
      <input type="checkbox" name="needs_computed" />
      <input type="checkbox" name="dq_mobile" />
      <input type="checkbox" name="dq_ai_agent" />
      <input type="checkbox" name="dq_sso" />
      <input type="checkbox" name="dq_realtime" />
      <input type="checkbox" name="dq_multitenant" />
      <input type="checkbox" name="dq_compliance" />
      <input type="checkbox" name="dq_marketing_site" />
      <input type="checkbox" name="dq_data_imports" />
      <input type="checkbox" name="dq_none" />
      <input type="checkbox" name="start_asap" />
      <input type="date" name="start_date" />
      <input type="text" name="can_commit" />
      <input type="text" name="commit_explain" />
      <input type="text" name="hosting_plan" />
      <input type="text" name="bought_before" />
      <input type="text" name="bought_explain" />
      <textarea name="anything_else"></textarea>
      <input type="text" name="heard_about" />
      <input type="text" name="heard_other" />
      <input type="text" name="utm_source" />
      <input type="text" name="utm_medium" />
      <input type="text" name="utm_campaign" />
      <input type="text" name="utm_content" />
      <input type="text" name="utm_term" />
      <input type="text" name="fbclid" />
      <input type="text" name="gclid" />
      <input type="text" name="referrer" />
      <input type="text" name="landing_page" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
